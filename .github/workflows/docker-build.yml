name: Build and Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version tag'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: frontend
            image: opendataworks-frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            build_args: ""
          - name: backend
            image: opendataworks-backend
            context: .
            dockerfile: ./backend/Dockerfile
            build_args: ""
          - name: odw-mcp-server
            image: opendataworks-odw-mcp-server
            context: .
            dockerfile: ./odw-mcp-server/Dockerfile
            build_args: ""



    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=raw,value=${{ github.event.inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version != '' && (github.event.inputs.version != 'latest' || github.ref == 'refs/heads/main') }}

      - name: Build
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: ${{ matrix.service.build_args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ runner.os }}-buildx-${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ runner.os }}-buildx-${{ matrix.service.name }},sharing=locked

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: ${{ matrix.service.build_args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ runner.os }}-buildx-${{ matrix.service.name }}

      - name: Image digest
        if: github.event_name != 'pull_request'
        run: echo "Image digest ${{ steps.push.outputs.digest }}"

  create-release:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create offline deployment package
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          chmod +x scripts/create-offline-package.sh
          scripts/create-offline-package.sh \
            --namespace "${{ secrets.DOCKER_USERNAME }}" \
            --tag "$VERSION" \
            --output "opendataworks-deployment-${VERSION}.tar.xz" \
            --platform linux/amd64
          echo "PACKAGE_PATH=opendataworks-deployment-${VERSION}.tar.xz" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Generate checksum
        run: |
          sha256sum "$PACKAGE_PATH" > "${PACKAGE_PATH}.sha256"
          echo "PACKAGE_SHA=${PACKAGE_PATH}.sha256" >> $GITHUB_ENV

      - name: Create Release Body
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          REPO="${{ github.repository }}"
          TAG="${{ github.ref_name }}"
          NS="${{ secrets.DOCKER_USERNAME }}"
          {
            echo "## OpenDataWorks v${VERSION}"
            echo ""
            echo "## 📦 下载 / Downloads"
            echo ""
            echo "### 离线部署包 (Offline Deployment Package)"
            echo "- **[opendataworks-deployment-${VERSION}.tar.xz](https://github.com/${REPO}/releases/download/${TAG}/opendataworks-deployment-${VERSION}.tar.xz)** - 适用于无外网环境（需 xz 解压：tar -xJf）"
            echo "- 校验和: \`opendataworks-deployment-${VERSION}.tar.xz.sha256\`"
            echo "### Docker 镜像 (Docker Images)"
            echo "- [Frontend](https://hub.docker.com/r/${NS}/opendataworks-frontend/tags?name=${VERSION})"
            echo "- [Backend](https://hub.docker.com/r/${NS}/opendataworks-backend/tags?name=${VERSION})"
            echo "- [ODW MCP Server](https://hub.docker.com/r/${NS}/opendataworks-odw-mcp-server/tags?name=${VERSION})"
            echo ""
            echo '```bash'
            echo "docker pull ${NS}/opendataworks-frontend:${VERSION}"
            echo "docker pull ${NS}/opendataworks-backend:${VERSION}"
            echo "docker pull ${NS}/opendataworks-odw-mcp-server:${VERSION}"
            echo '```'
          } > release_body.md
          echo "RELEASE_BODY_FILE=release_body.md" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          body_path: release_body.md
          files: |
            ${{ env.PACKAGE_PATH }}
            ${{ env.PACKAGE_SHA }}

  create-latest-release:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: create-latest-release
      cancel-in-progress: true
    env:
      RELEASE_TAG: latest
      IMAGE_TAG: latest
      RELEASE_NAME: OpenDataWorks latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create latest offline deployment package
        run: |
          chmod +x scripts/create-offline-package.sh
          scripts/create-offline-package.sh \
            --namespace "${{ secrets.DOCKER_USERNAME }}" \
            --tag "${IMAGE_TAG}" \
            --output "opendataworks-deployment-${RELEASE_TAG}.tar.xz" \
            --platform linux/amd64
          echo "PACKAGE_PATH=opendataworks-deployment-${RELEASE_TAG}.tar.xz" >> $GITHUB_ENV

      - name: Generate checksum
        run: |
          sha256sum "$PACKAGE_PATH" > "${PACKAGE_PATH}.sha256"
          echo "PACKAGE_SHA=${PACKAGE_PATH}.sha256" >> $GITHUB_ENV

      - name: Create latest release body
        run: |
          REPO="${{ github.repository }}"
          TAG="${RELEASE_TAG}"
          NS="${{ secrets.DOCKER_USERNAME }}"
          {
            echo "## OpenDataWorks ${TAG}"
            echo ""
            echo "Source commit: \`${{ github.sha }}\`"
            echo ""
            echo "## 📦 下载 / Downloads"
            echo ""
            echo "### 离线部署包 (Offline Deployment Package)"
            echo "- **[${PACKAGE_PATH}](https://github.com/${REPO}/releases/download/${TAG}/${PACKAGE_PATH})**（需 xz 解压：tar -xJf）"
            echo "- 校验和: \`${PACKAGE_PATH}.sha256\`"
            echo "### Docker 镜像 (Docker Images)"
            echo "- [Frontend](https://hub.docker.com/r/${NS}/opendataworks-frontend/tags?name=${IMAGE_TAG})"
            echo "- [Backend](https://hub.docker.com/r/${NS}/opendataworks-backend/tags?name=${IMAGE_TAG})"
            echo "- [ODW MCP Server](https://hub.docker.com/r/${NS}/opendataworks-odw-mcp-server/tags?name=${IMAGE_TAG})"
            echo ""
            echo '```bash'
            echo "docker pull ${NS}/opendataworks-frontend:${IMAGE_TAG}"
            echo "docker pull ${NS}/opendataworks-backend:${IMAGE_TAG}"
            echo "docker pull ${NS}/opendataworks-odw-mcp-server:${IMAGE_TAG}"
            echo '```'
          } > latest_release_body.md

      - name: Reset latest release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if gh release view "${RELEASE_TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            gh release delete "${RELEASE_TAG}" --repo "${REPO}" --cleanup-tag --yes
          fi

          # Ensure stale tag is removed even if no release exists.
          gh api -X DELETE "repos/${REPO}/git/refs/tags/${RELEASE_TAG}" >/dev/null 2>&1 || true

      - name: Create or update latest release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          target_commitish: ${{ github.sha }}
          body_path: latest_release_body.md
          files: |
            ${{ env.PACKAGE_PATH }}
            ${{ env.PACKAGE_SHA }}

  summary:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Create summary
        run: |
          echo "## 🐳 Docker Images Built Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Images pushed to Docker Hub:" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ secrets.DOCKER_USERNAME }}/opendataworks-frontend\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ secrets.DOCKER_USERNAME }}/opendataworks-backend\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ secrets.DOCKER_USERNAME }}/opendataworks-odw-mcp-server\`" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Platforms supported:" >> $GITHUB_STEP_SUMMARY
          echo "- linux/amd64 (x86_64)" >> $GITHUB_STEP_SUMMARY
          echo "- linux/arm64 (aarch64)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pull commands:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ secrets.DOCKER_USERNAME }}/opendataworks-frontend:latest" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ secrets.DOCKER_USERNAME }}/opendataworks-backend:latest" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ secrets.DOCKER_USERNAME }}/opendataworks-odw-mcp-server:latest" >> $GITHUB_STEP_SUMMARY

          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
