name: Internal identifier scan

# This repository is public. Real table names and business terms have reached it
# twice before, both caught by hand. The existing workflows only build and
# deploy, so this is the one place a leak can be stopped automatically.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scan tracked files for internal identifiers
        run: python3 scripts/check-internal-identifiers.py
