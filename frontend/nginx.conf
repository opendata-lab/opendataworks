server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;
    # 启用 gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # SPA 路由支持
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 仅转发 DataAgent widget bundle，供门户「Agent问答」内嵌加载使用。
    # DataAgent 整站不再经 8081 转发，直接通过 dataagent-frontend（:8901）访问。
    # 使用 ^~ 确保 /dataagent/widget/ 前缀优先于下方的静态资源正则匹配，
    # 否则 widget bundle（/dataagent/widget/*.js）会被 \.js$ 正则拦截，
    # nginx 转去本地 dist 查找该文件并返回 404，导致 Agent问答 加载失败。
    location ^~ /dataagent/widget/ {
        proxy_pass http://dataagent-frontend:80/widget/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/dataagent/ {
        # Skill import also uploads multipart data through DataAgent.
        client_max_body_size 25m;
        proxy_pass http://dataagent-backend:8900/api/v1/dataagent/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/nl2sql-admin/ {
        # DataAgent 会话附件 / 技能导入走 multipart 上传，nginx 默认 client_max_body_size
        # 只有 1m，1M 出头的附件在反代层就被拦成 413，请求根本到不了后端。
        # 这里略高于后端 DATAAGENT_UPLOAD_MAX_BYTES（默认 20 MiB），让真正超限的
        # 文件由后端返回可读的 JSON 413，而不是 nginx 的空白错误页。
        client_max_body_size 25m;
        proxy_pass http://dataagent-backend:8900/api/v1/nl2sql-admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/nl2sql/ {
        # DataAgent 会话附件 / 技能导入走 multipart 上传，nginx 默认 client_max_body_size
        # 只有 1m，1M 出头的附件在反代层就被拦成 413，请求根本到不了后端。
        # 这里略高于后端 DATAAGENT_UPLOAD_MAX_BYTES（默认 20 MiB），让真正超限的
        # 文件由后端返回可读的 JSON 413，而不是 nginx 的空白错误页。
        client_max_body_size 25m;
        proxy_pass http://dataagent-backend:8900/api/v1/nl2sql/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 420s;
        proxy_send_timeout 420s;
        add_header X-Accel-Buffering no;
    }

    # API 代理到后端
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 缓存静态资源
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
