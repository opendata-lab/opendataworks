server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # 本 server 下的 API 全部反代到 dataagent-backend，其中会话附件、技能导入、
    # 评测集导入都是 multipart 上传。nginx 默认 client_max_body_size 只有 1m，
    # 1M 出头的附件在反代层就被拦成 413，请求根本到不了后端，所以在 server 级放开。
    # 取值略高于后端 DATAAGENT_UPLOAD_MAX_BYTES（默认 20 MiB），让真正超限的文件
    # 由后端返回可读的 JSON 413，而不是 nginx 的空白错误页。
    client_max_body_size 25m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # FAB/Superset 约定的 OAuth 回调必须由后端处理，不能落入 SPA fallback。
    location ^~ /oauth-authorized/ {
        proxy_pass http://dataagent-backend:8900/oauth-authorized/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 使用 ^~ 确保 /widget/ 前缀优先于下方的静态资源正则匹配，
    # 否则未带哈希的 widget bundle（*.bundle.js）会落入 \.js$ 正则，
    # 被错误地按 1 年 immutable 缓存，升级后客户端拿到旧脚本。
    location ^~ /widget/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300";
    }

    location /api/v1/dataagent/ {
        proxy_pass http://dataagent-backend:8900/api/v1/dataagent/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/nl2sql-admin/ {
        proxy_pass http://dataagent-backend:8900/api/v1/nl2sql-admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/nl2sql/ {
        proxy_pass http://dataagent-backend:8900/api/v1/nl2sql/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 420s;
        proxy_send_timeout 420s;
        add_header X-Accel-Buffering no;
    }

    location /api/v1/nl2sql-eval/ {
        proxy_pass http://dataagent-backend:8900/api/v1/nl2sql-eval/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
