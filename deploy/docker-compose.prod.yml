# 只保留跨服务接线；任务、调度、缓存等默认值由应用代码维护。
x-dataagent-environment: &dataagent-environment
  MYSQL_HOST: mysql
  MYSQL_USER: ${DATAAGENT_MYSQL_USER:-dataagent}
  MYSQL_PASSWORD: ${DATAAGENT_MYSQL_PASSWORD:-dataagent123}
  MYSQL_DATABASE: ${DATAAGENT_SESSION_MYSQL_DATABASE:-dataagent}
  SESSION_MYSQL_DATABASE: ${DATAAGENT_SESSION_MYSQL_DATABASE:-dataagent}
  SKILLS_ROOT_DIR: /app/.claude/skills

# 统一容器日志驱动：json-file + 轮转。
# 所有服务日志稳定落在宿主机 docker 数据目录、容器重启不丢，单服务最多保留 20m*5=100MB，
# 避免默认无轮转把磁盘撑爆。导出成宿主机包目录文件见 scripts/dump-logs.sh。
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  # Note: opendataagent is intentionally deployed via opendataagent/deploy/docker-compose.yml
  # and is not part of the root portal compose stack.
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: opendataworks-mysql
    logging: *default-logging
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-opendataworks}
      MYSQL_USER: ${MYSQL_USER:-opendataworks}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-opendataworks123}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/mysql:/docker-entrypoint-initdb.d:ro
    networks:
      - opendataworks-network
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h localhost -uroot"]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:7.2-alpine
    container_name: opendataworks-redis
    logging: *default-logging
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    networks:
      - opendataworks-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端服务
  backend:
    image: ${OPENDATAWORKS_BACKEND_IMAGE:-mikefan2019/opendataworks-backend:1.5.0}
    container_name: opendataworks-backend
    logging: *default-logging
    restart: always
    env_file:
      - ./.env
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-opendataworks}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-${MYSQL_USER:-opendataworks}}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-${MYSQL_PASSWORD:-opendataworks123}}
      AGENT_API_SERVICE_TOKEN: ${AGENT_API_SERVICE_TOKEN:-odw-agent-service-token}
    # DolphinScheduler 不包含在本 Compose 中，配置请在系统管理界面进行
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - opendataworks-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - backend-logs:/app/logs

  # 前端服务
  frontend:
    image: ${OPENDATAWORKS_FRONTEND_IMAGE:-mikefan2019/opendataworks-frontend:1.5.0}
    container_name: opendataworks-frontend
    logging: *default-logging
    restart: always
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_started
      dataagent-frontend:
        condition: service_healthy
    networks:
      - opendataworks-network
    # nginx 配置默认使用镜像内构建版本；如需宿主机管理（Superset docker/nginx 同款），
    # 取消下面挂载的注释并按需修改 ./docker/nginx/ 下的对应 conf。
    # volumes:
    #   - ./docker/nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  dataagent-frontend:
    image: ${OPENDATAWORKS_DATAAGENT_FRONTEND_IMAGE:-mikefan2019/opendataworks-dataagent-frontend:1.5.0}
    container_name: opendataworks-dataagent-frontend
    logging: *default-logging
    restart: always
    ports:
      - "8901:80"
    depends_on:
      dataagent-backend:
        condition: service_healthy
    networks:
      - opendataworks-network
    # nginx 配置默认使用镜像内构建版本；如需宿主机管理（Superset docker/nginx 同款），
    # 取消下面挂载的注释并按需修改 ./docker/nginx/ 下的对应 conf。
    # volumes:
    #   - ./docker/nginx/dataagent-frontend.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # DataAgent 持久化目录初始化（以 root 预创建并修正属主，避免非 root 容器写 /dataagent_runtime 报 permission denied）
  dataagent-home-init:
    image: ${OPENDATAWORKS_DATAAGENT_BACKEND_IMAGE:-mikefan2019/opendataworks-dataagent-backend:1.5.0}
    container_name: opendataworks-dataagent-home-init
    logging: *default-logging
    user: "0:0"
    restart: "no"
    command:
      - sh
      - -c
      - |
        set -e
        mkdir -p /dataagent_runtime /app/.claude/skills
        chown -R ${DATAAGENT_RUNTIME_UID:-1000}:${DATAAGENT_RUNTIME_GID:-1000} /dataagent_runtime /app/.claude/skills
        chmod -R u+rwX /dataagent_runtime /app/.claude/skills
    networks:
      - opendataworks-network
    volumes:
      - ${DATAAGENT_HOST_ROOT:-/dataagent_runtime}:/dataagent_runtime
      - dataagent-skills:/app/.claude/skills

  # DataAgent 后端服务（NL2SQL）
  dataagent-backend:
    image: ${OPENDATAWORKS_DATAAGENT_BACKEND_IMAGE:-mikefan2019/opendataworks-dataagent-backend:1.5.0}
    container_name: opendataworks-dataagent-backend
    logging: *default-logging
    restart: always
    user: "${DATAAGENT_RUNTIME_UID:-1000}:${DATAAGENT_RUNTIME_GID:-1000}"
    environment:
      <<: *dataagent-environment
      REDIS_HOST: redis
      DATAAGENT_SANDBOX_RUNNER_URL: http://dataagent-sandbox-runner:8910
      DATAAGENT_SANDBOX_MODE: ${DATAAGENT_SANDBOX_MODE:-}
      DATAAGENT_CONFIG: /app/docker/dataagent/dataagent_config.py
    ports:
      - "8900:8900"
    depends_on:
      dataagent-home-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      dataagent-sandbox-runner:
        condition: service_healthy
    networks:
      - opendataworks-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8900/api/v1/nl2sql/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    volumes:
      - ${DATAAGENT_HOST_ROOT:-/dataagent_runtime}:/dataagent_runtime
      - dataagent-skills:/app/.claude/skills
      # DataAgent 外置配置目录（基础配置 + 用户覆盖/扩展模块，见目录内注释）：
      - ./docker/dataagent:/app/docker/dataagent:ro

  # DataAgent 沙箱 Runner（内部服务）
  dataagent-sandbox-runner:
    image: ${OPENDATAWORKS_DATAAGENT_RUNNER_IMAGE:-mikefan2019/opendataworks-dataagent-runner:1.5.0}
    container_name: opendataworks-dataagent-sandbox-runner
    logging: *default-logging
    restart: always
    user: "${DATAAGENT_RUNNER_UID:-0}:${DATAAGENT_RUNNER_GID:-0}"
    environment:
      <<: *dataagent-environment
      DATAAGENT_HOST_ROOT: ${DATAAGENT_HOST_ROOT:-/dataagent_runtime}
      DATAAGENT_RUNTIME_UID: ${DATAAGENT_RUNTIME_UID:-1000}
      DATAAGENT_RUNTIME_GID: ${DATAAGENT_RUNTIME_GID:-1000}
      DATAAGENT_SANDBOX_MODE: ""
      DATAAGENT_SANDBOX_IMAGE: ${OPENDATAWORKS_DATAAGENT_RUNNER_IMAGE:-mikefan2019/opendataworks-dataagent-runner:1.5.0}
      DATAAGENT_SANDBOX_NETWORK: container:opendataworks-dataagent-sandbox-runner
    depends_on:
      dataagent-home-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
    networks:
      - opendataworks-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8910/').read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - ${DATAAGENT_HOST_ROOT:-/dataagent_runtime}:/dataagent_runtime
      - dataagent-skills:/app/.claude/skills
      - ${DATAAGENT_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock

  odw-mcp-server:
    image: ${OPENDATAWORKS_ODW_MCP_SERVER_IMAGE:-mikefan2019/opendataworks-odw-mcp-server:1.5.0}
    container_name: opendataworks-odw-mcp-server
    logging: *default-logging
    restart: always
    env_file:
      - ./.env
    environment:
      ODW_MCP_SERVER_BACKEND_SERVICE_TOKEN: ${AGENT_API_SERVICE_TOKEN:-odw-agent-service-token}
      ODW_MCP_SERVER_FRONTDOOR_TOKEN: ${ODW_MCP_SERVER_TOKEN:-odw-odw-mcp-server-token}
      ODW_MCP_SERVER_FRONTDOOR_TOKEN_HEADER_NAME: ${ODW_MCP_SERVER_TOKEN_HEADER_NAME:-X-ODW-MCP-Token}
    ports:
      - "8801:8801"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - opendataworks-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8801/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # 日志收集 sidecar：复用 runner 镜像自带的 docker CLI，只读挂 docker socket，
  # 对每个目标容器实时 `docker logs --follow` 写到宿主机 deploy/logs/<container>.log。
  # 只收集应用服务（backend / dataagent-backend / sandbox-runner / odw-mcp-server），无需改业务镜像、无各服务挂卷权限问题。
  # 不收集 mysql/redis 基础设施与两个 nginx 前端；如需可在 .env 用 LOG_COLLECTOR_CONTAINERS 增减。
  # task child 日志由 runner 另行落盘在 <HOST_ROOT>/<topic>/logs/。
  log-collector:
    image: ${OPENDATAWORKS_DATAAGENT_RUNNER_IMAGE:-mikefan2019/opendataworks-dataagent-runner:1.5.0}
    container_name: opendataworks-log-collector
    logging: *default-logging
    restart: always
    user: "${DATAAGENT_RUNNER_UID:-0}:${DATAAGENT_RUNNER_GID:-0}"
    environment:
      # 目标容器列表（仅应用服务），可在 .env 覆盖 LOG_COLLECTOR_CONTAINERS 增减
      LOG_COLLECTOR_CONTAINERS: ${LOG_COLLECTOR_CONTAINERS:-opendataworks-backend opendataworks-dataagent-backend opendataworks-dataagent-sandbox-runner opendataworks-odw-mcp-server}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -u
        mkdir -p /logs
        echo "[log-collector] following: $$LOG_COLLECTOR_CONTAINERS"
        for c in $$LOG_COLLECTOR_CONTAINERS; do
          (
            while true; do
              # --tail 0：仅从挂接点起的新日志，避免重连后重复回灌历史。
              # 历史完整日志由 json-file 轮转与 scripts/dump-logs.sh 兜底。
              docker logs --follow --timestamps --tail 0 "$$c" >> "/logs/$$c.log" 2>>"/logs/_collector.err" || true
              sleep 3
            done
          ) &
        done
        wait
    networks:
      - opendataworks-network
    volumes:
      - ./logs:/logs
      - ${DATAAGENT_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro

networks:
  opendataworks-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${OPENDATAWORKS_PROD_SUBNET:-10.71.0.0/24}
          gateway: ${OPENDATAWORKS_PROD_GATEWAY:-10.71.0.1}

volumes:
  dataagent-skills:
    driver: local
  mysql-data:
    driver: local
  backend-logs:
    driver: local
