services:
  # DataAgent 不在本 Compose 中，由 opendataagent 仓库的 deploy/docker-compose.yml 单独部署；
  # 门户内嵌 widget 所需的转发写在 ./docker/nginx/frontend.conf，按实际地址启用。
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    pull_policy: always
    container_name: opendataworks-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-opendataworks}
      MYSQL_USER: ${MYSQL_USER:-opendataworks}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-opendataworks123}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "3316:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h localhost -uroot"]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:7.2-alpine
    pull_policy: always
    container_name: opendataworks-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端服务
  backend:
    image: ${OPENDATAWORKS_BACKEND_IMAGE:-mikefan2019/opendataworks-backend:latest}
    pull_policy: always
    container_name: opendataworks-backend
    restart: always
    env_file:
      - ./.env
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-opendataworks}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-${MYSQL_USER:-opendataworks}}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-${MYSQL_PASSWORD:-opendataworks123}}
      AGENT_API_SERVICE_TOKEN: ${AGENT_API_SERVICE_TOKEN:-odw-agent-service-token}
    # DolphinScheduler 不包含在本 Compose 中，配置请在系统管理界面进行
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - backend-logs:/app/logs

  # 前端服务
  frontend:
    image: ${OPENDATAWORKS_FRONTEND_IMAGE:-mikefan2019/opendataworks-frontend:latest}
    pull_policy: always
    container_name: opendataworks-frontend
    restart: always
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_healthy
    # nginx 配置由宿主机管理：DataAgent widget 与 API 的转发在该文件中按实际地址启用。
    volumes:
      - ./docker/nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  odw-mcp-server:
    image: ${OPENDATAWORKS_ODW_MCP_SERVER_IMAGE:-mikefan2019/opendataworks-odw-mcp-server:latest}
    pull_policy: always
    container_name: opendataworks-odw-mcp-server
    restart: always
    env_file:
      - ./.env
    environment:
      ODW_MCP_SERVER_BACKEND_SERVICE_TOKEN: ${AGENT_API_SERVICE_TOKEN:-odw-agent-service-token}
      ODW_MCP_SERVER_FRONTDOOR_TOKEN: ${ODW_MCP_SERVER_TOKEN:-odw-odw-mcp-server-token}
      ODW_MCP_SERVER_FRONTDOOR_TOKEN_HEADER_NAME: ${ODW_MCP_SERVER_TOKEN_HEADER_NAME:-X-ODW-MCP-Token}
    ports:
      - "8801:8801"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8801/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  mysql-data:
    driver: local
  backend-logs:
    driver: local
